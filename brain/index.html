<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dr. Pool Brain</title><meta name="robots" content="noindex">
<style>
:root{--ink:#06303b;--sub:#4d7480;--bg:#f2f9fa;--card:#fff;--line:#c7e2e6;--hd:#0a5a6b;--ok:#1b8a4b;--warn:#b7791f;--err:#c4383e}
@media(prefers-color-scheme:dark){:root{--ink:#e1f3f5;--sub:#8db4bd;--bg:#071d24;--card:#0c2831;--line:#1c4551;--ok:#58d68d;--warn:#f0b34a;--err:#ff7a7f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}h1{margin:8px 0 2px}h2{margin:24px 0 8px;font-size:17px}
.sub{color:var(--sub);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--sub)}
.ok{background:var(--ok)}.warn{background:var(--warn)}.err{background:var(--err)}
.flow{display:grid;gap:8px}.fl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.fl b{white-space:nowrap}.ar{color:var(--sub)}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px}
td,th{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}.msg{padding:14px;border:1px solid var(--err);border-radius:10px;color:var(--err)}
button{font:inherit;border:0;border-radius:8px;background:var(--hd);color:#fff;padding:6px 12px;cursor:pointer}
</style></head><body>
<main id="app"><h1>Dr. Pool Brain</h1><p class="sub">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/drpool.js"></script>
<script>
(async()=>{
const me=await DrPool.requireLogin({office:true}); if(!me)return; DrPool.topBar('brain');
const sb=DrPool.sb, app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{if(!t)return 'never';const m=(Date.now()-new Date(t))/60000;if(m<2)return 'just now';if(m<90)return Math.round(m)+' min ago';if(m<2880)return Math.round(m/60)+' h ago';return Math.round(m/1440)+' days ago'};
const age=t=>t?(Date.now()-new Date(t))/86400000:null;
async function load(){
 app.innerHTML='<h1>Dr. Pool Brain</h1><p class="sub">Loading…</p>';
 try{
  const [st,tk,wa,pr]=await Promise.all([
   sb.from('v_brain_status').select('*'),
   sb.from('tasks').select('id,type,assignee,note,done,source,created_at,created_by').eq('workspace','team').order('created_at',{ascending:false}).limit(200),
   sb.from('wa_threads').select('id,done,task_id,customer_id,started_at').order('started_at',{ascending:false}).limit(200),
   sb.from('prospects').select('stage,updated_at')]);
  for(const r of [st,tk,wa,pr]) if(r.error) throw new Error(r.error.message);
  const S={};st.data.forEach(r=>S[r.dataset]=r);
  const tasks=tk.data, threads=wa.data;
  const bySrc=k=>tasks.filter(t=>t.source===k);
  const card=(name,desc,rows,last,state,extra)=>`<div class="card"><h3><span><span class="dot ${state}"></span>${esc(name)}</span><span class="sub">${esc(rows)}</span></h3><div class="sub">${esc(desc)}</div><div class="sub">Last change: ${esc(ago(last))}</div>${extra?`<div class="sub">${extra}</div>`:''}</div>`;
  const st1=(d,stale)=>{const r=S[d];if(!r||!r.rows)return 'err';const a=age(r.last_change);return a!=null&&a>stale?'warn':'ok'};
  const n=d=>S[d]?Number(S[d].rows).toLocaleString():'0';
  const openWa=threads.filter(t=>!t.done).length, waTasks=threads.filter(t=>t.task_id).length;
  const waOpenTasks=bySrc('whatsapp').filter(t=>!t.done).length, rpOpen=bySrc('route_planner').filter(t=>!t.done).length;
  const qb=['qb_customers','qb_invoices','qb_payments','bg_customers','bg_payments'].reduce((a,d)=>a+Number((S[d]||{}).rows||0),0);
  const stages={};pr.data.forEach(p=>stages[p.stage]=(stages[p.stage]||0)+1);
  app.innerHTML=`<h1>Dr. Pool Brain</h1><p class="sub">Live from the shared database · ${new Date().toLocaleTimeString()} · <button id="rf">Refresh</button></p>
  <h2>Find a client</h2><form id="cf" style="display:flex;gap:8px;flex-wrap:wrap"><input id="cq" placeholder="Name, email, address or account #" style="flex:1;min-width:220px;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)"><button>Search</button></form><div id="cr"></div>
  <h2>Every tool and what it holds</h2><div class="grid">
  ${card('Customers',"Names, addresses, emails, rates — the base for everything",n('customers'),S.customers&&S.customers.last_change,st1('customers',30))}
  ${card('Route schedule','Weekly route stops: CRM, Route Planner, Dashboard read this',n('route_stops')+' stops',S.route_stops&&S.route_stops.last_change,st1('route_stops',8),'Only the week of Oct 25 is loaded')}
  ${card('CRM tasks & jobs','Team workspace — what staff see',n('tasks')+' tasks · '+n('jobs')+' jobs',S.tasks&&S.tasks.last_change,st1('tasks',14))}
  ${card('WhatsApp board','Tech reports from route chats',n('wa_threads')+' threads',S.wa_threads&&S.wa_threads.last_change,st1('wa_threads',3),openWa+' not handled · '+waTasks+' sent to CRM')}
  ${card('Email Chalkboard','Inbox to-dos',n('chalkboard_items')+' items',S.chalkboard_items&&S.chalkboard_items.last_change,st1('chalkboard_items',1))}
  ${card('Prospects','New customers waiting on us',n('prospects')+' prospects',S.prospects&&S.prospects.last_change,st1('prospects',7),Object.entries(stages).map(([k,v])=>esc(k)+': '+v).join(' · '))}
  ${card('SCP chemical tally','Supplier invoices',n('supplier_invoices')+' invoices',S.supplier_invoices&&S.supplier_invoices.last_change,st1('supplier_invoices',14))}
  ${card('Pool Boys Dashboard','Trucks and GPS',n('vehicles')+' vehicles',S.gps_daily&&S.gps_daily.last_change,st1('gps_daily',7),'GPS days: '+n('gps_daily'))}
  ${card('QuickBooks / Biller Genie','What each customer pays — waiting for reports',qb?qb+' rows':'nothing loaded',null,qb?'ok':'err','Send me a report to load it')}
  </div>
  <h2>How a change travels</h2><div class="flow">
   <div class="fl"><b>Route schedule</b><span class="ar">→</span> CRM customer page · Route Planner · Dashboard · WhatsApp "Which pool?" picker</div>
   <div class="fl"><b>WhatsApp complaint</b><span class="ar">→</span> WhatsApp board <span class="ar">→</span> "Send to CRM" with assignee (e.g. David) <span class="ar">→</span> task in David's CRM list <span class="ar">→</span> <span class="sub">(next) QuickBooks estimate / PO</span></div>
   <div class="fl"><b>Route Planner PO</b><span class="ar">→</span> task to any staff member <span class="ar">→</span> CRM</div>
   <div class="fl"><b>Customer email</b><span class="ar">→</span> Email Chalkboard / Prospects <span class="ar">→</span> linked to customer</div>
   <div class="fl"><b>QuickBooks / Biller Genie reports</b><span class="ar">→</span> CRM customer billing line</div></div>
  <h2>Tasks sent between tools</h2><div class="sub">${waOpenTasks} open from WhatsApp · ${rpOpen} open from Route Planner</div>
  ${(()=>{const L=tasks.filter(t=>t.source==='whatsapp'||t.source==='route_planner').slice(0,10);return L.length?`<table><tr><th>From</th><th>To</th><th>Note</th><th>Status</th><th>When</th></tr>${L.map(t=>`<tr><td>${esc(t.source)}</td><td>${esc(t.assignee)}</td><td>${esc((t.note||'').slice(0,80))}</td><td>${t.done?'done':'open'}</td><td>${esc(ago(t.created_at))}</td></tr>`).join('')}</table>`:'<p class="sub">None yet. When you press "Send to CRM" on the WhatsApp or Route Planner page, it shows up here and in the assignee\'s CRM list.</p>'})()}`;
  document.getElementById('rf').onclick=load;
  clientSearch();
  if(['daniel','david'].includes(me.username)) editors(); else app.insertAdjacentHTML('beforeend','<h2>Edit schedule &amp; dashboard</h2><p class="sub">Only Daniel and David can edit the route schedule and the Pool Boys vehicles.</p>');
 }catch(e){app.innerHTML=`<h1>Dr. Pool Brain</h1><div class="msg">Could not load: ${esc(e.message)} <button id="rf">Try again</button></div>`;document.getElementById('rf').onclick=load}
}

function clientSearch(){
 const f=document.getElementById('cf'),out=document.getElementById('cr');
 const lk=v=>String(v).replace(/[\\%_,()]/g,m=>m===','||m==='('||m===')'?' ':'\\'+m);
 const money=n=>n==null?'—':'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
 const fd=d=>d?new Date(String(d).slice(0,10)+'T12:00').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):'—';
 async function card(id){
  out.innerHTML='<p class="sub">Loading…</p>';
  const [c,sch,tk,em,wa,cl]=await Promise.all([
   sb.from('v_customer_360').select('*').eq('id',id).maybeSingle(),
   sb.from('v_schedule_current').select('week_of,route_no,tech_name,day,slot,price,service_code,flag').eq('customer_id',id),
   sb.from('tasks').select('type,assignee,note,done,due_at,source,created_at').eq('workspace','team').eq('customer_id',id).order('created_at',{ascending:false}).limit(10),
   sb.from('chalkboard_items').select('title,bucket,detail,at,done,link,assigned_to').eq('customer_id',id).order('at',{ascending:false}).limit(8),
   sb.from('wa_threads').select('group_name,started_at,done').eq('customer_id',id).order('started_at',{ascending:false}).limit(5),
   sb.from('calls').select('summary,started_at,direction').eq('customer_id',id).order('started_at',{ascending:false}).limit(5)]);
  const x=c.data; if(!x){out.innerHTML='<div class="msg">Client not found.</div>';return}
  let emails=em.data||[];
  if(x.email){const e2=await sb.from('chalkboard_items').select('title,bucket,detail,at,done,link,assigned_to').ilike('contact_email',lk(x.email)).order('at',{ascending:false}).limit(8);
   if(e2.data){const seen=new Set(emails.map(r=>r.title+r.at));emails=emails.concat(e2.data.filter(r=>!seen.has(r.title+r.at)))}}
  const li=(a,fn,empty)=>a&&a.length?'<ul style="margin:4px 0;padding-left:18px">'+a.map(r=>'<li>'+fn(r)+'</li>').join('')+'</ul>':'<div class="sub">'+empty+'</div>';
  const billing=(x.qb_balance==null&&x.autopay==null&&x.last_paid_on==null)?'<div class="sub">Billing: no QuickBooks / Biller Genie report loaded yet</div>':'<div>Balance '+money(x.qb_balance)+' · Autopay '+(x.autopay==null?'not loaded':x.autopay?'yes':'no')+' · Last paid '+fd(x.last_paid_on)+'</div>';
  out.innerHTML=`<div class="card" style="margin-top:10px"><h3><span>${esc(x.name)}</span><span class="sub">#${esc(x.account_no)} · ${esc(x.status)}</span></h3>
   <div>${x.email?`<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:'<span class="sub">no email on file</span>'}${x.phone?' · '+esc(x.phone):''}</div>
   <div class="sub">${esc([x.address,x.city].filter(Boolean).join(', '))}</div>
   <div>Rate: <b>${money(x.monthly_rate)}</b>/month${x.service_level?' · '+esc(x.service_level):''}</div>${billing}
   <h4 style="margin:10px 0 2px">Route</h4>${li(sch.data,r=>`Route ${esc(r.route_no)} (${esc(r.tech_name)}) · ${esc(r.day)} stop ${esc(r.slot)}${r.price!=null?' · '+money(r.price):''}${r.flag?' · '+esc(r.flag):''}`,'Not on the loaded schedule week'+(x.route_no?' (CRM says route '+esc(x.route_no)+')':''))}
   <h4 style="margin:10px 0 2px">CRM tasks</h4>${li(tk.data,r=>`${r.done?'✓':'○'} ${esc(r.type)} → ${esc(r.assignee)}${r.due_at?' · due '+esc(fd(r.due_at)):''}${r.note?' · '+esc(r.note.slice(0,100)):''}${r.source?' <span class="sub">('+esc(r.source)+')</span>':''}`,'No team tasks on this client')}
   <h4 style="margin:10px 0 2px">Recent emails / inbox items</h4>${li(emails,r=>`${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)} <span class="sub">${esc(r.bucket)} · ${esc(fd(r.at))}${r.done?' · done':''}</span>`,'No inbox items matched')}
   <h4 style="margin:10px 0 2px">WhatsApp reports</h4>${li(wa.data,r=>esc(r.group_name)+' · '+esc(fd(r.started_at))+(r.done?' · handled':''),'None')}
   <h4 style="margin:10px 0 2px">Calls</h4>${li(cl.data,r=>esc(fd(r.started_at))+' · '+esc((r.summary||'').slice(0,120)),'None')}</div>`;
 }
 f.onsubmit=async ev=>{ev.preventDefault();const q=document.getElementById('cq').value.trim();if(q.length<2){out.innerHTML='<p class="sub">Type at least 2 characters.</p>';return}
  out.innerHTML='<p class="sub">Searching…</p>';const t=lk(q);
  const r=await sb.from('customers').select('id,name,address,city,account_no,status').or(`name.ilike.%${t}%,email.ilike.%${t}%,address.ilike.%${t}%,account_no.ilike.%${t}%`).order('name').limit(15);
  if(r.error){out.innerHTML='<div class="msg">'+esc(r.error.message)+'</div>';return}
  if(!r.data.length){out.innerHTML='<p class="sub">No client found.</p>';return}
  if(r.data.length===1){card(r.data[0].id);return}
  out.innerHTML='<table>'+r.data.map(c=>`<tr><td><a href="#" data-id="${esc(c.id)}">${esc(c.name)}</a></td><td>${esc([c.address,c.city].filter(Boolean).join(', '))}</td><td>#${esc(c.account_no)} ${esc(c.status)}</td></tr>`).join('')+'</table>';
  out.querySelectorAll('a[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();card(a.dataset.id)});};
}

async function editors(){
 const box=document.createElement('div');app.appendChild(box);
 box.innerHTML='<h2>Edit route schedule</h2><p class="sub">Changes save to the shared schedule; the CRM, WhatsApp picker and Route Planner read it right away.</p><div id="rs"></div><h2>Edit Pool Boys vehicles</h2><div id="vh"></div>';
 const DAYS=['mon','tue','wed','thu','fri','sat'];
 const wk=await sb.from('route_stops').select('week_of').order('week_of',{ascending:false}).limit(1);
 const week=wk.data&&wk.data[0]&&wk.data[0].week_of;
 const rs=box.querySelector('#rs');
 if(!week){rs.innerHTML='<p class="sub">No schedule loaded.</p>'}else{
  const r=await sb.from('route_stops').select('id,route_no,day,slot,label,price,customer:customers!route_stops_customer_id_fkey(name)').eq('week_of',week).order('route_no').order('day').order('slot');
  if(r.error){rs.innerHTML='<div class="msg">'+esc(r.error.message)+'</div>'}else{
   const routes=[...new Set(r.data.map(x=>x.route_no))].sort((a,b)=>a-b);
   rs.innerHTML=`<p class="sub">Week of ${esc(week)} · <label>Route <select id="rsel">${routes.map(n=>`<option>${n}</option>`).join('')}</select></label> <span id="rmsg"></span></p><div id="rt"></div>`;
   const draw=()=>{const n=+rs.querySelector('#rsel').value;
    rs.querySelector('#rt').innerHTML=`<table><tr><th>Customer</th><th>Day</th><th>Route</th><th>Stop</th><th>Price</th><th></th></tr>${r.data.filter(x=>x.route_no===n).map(x=>`<tr data-id="${x.id}"><td>${esc(x.customer?x.customer.name:x.label)}</td><td><select class="d">${DAYS.map(d=>`<option${d===x.day?' selected':''}>${d}</option>`).join('')}</select></td><td><input class="rn" type="number" value="${x.route_no}" style="width:60px"></td><td><input class="sl" type="number" value="${x.slot}" style="width:60px"></td><td><input class="pr" type="number" step="0.01" value="${x.price==null?'':x.price}" style="width:80px"></td><td><button>Save</button></td></tr>`).join('')}</table>`;
    rs.querySelectorAll('tr[data-id] button').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr'),id=+tr.dataset.id,m=rs.querySelector('#rmsg');
     const patch={day:tr.querySelector('.d').value,route_no:+tr.querySelector('.rn').value,slot:+tr.querySelector('.sl').value,price:tr.querySelector('.pr').value===''?null:+tr.querySelector('.pr').value};
     const u=await sb.from('route_stops').update(patch).eq('id',id).select('id');
     if(u.error||!u.data.length){m.textContent='Not saved: '+(u.error?u.error.message:'no permission');return}
     Object.assign(r.data.find(x=>x.id===id),patch);m.textContent='Saved.'});};
   rs.querySelector('#rsel').onchange=draw;draw();}}
 const vh=box.querySelector('#vh');
 const v=await sb.from('vehicles').select('id,label,make_model,odometer,mpg,active').order('label');
 if(v.error){vh.innerHTML='<div class="msg">'+esc(v.error.message)+'</div>';return}
 vh.innerHTML=`<table><tr><th>Vehicle</th><th>Model</th><th>Odometer</th><th>MPG</th><th>Active</th><th></th></tr>${v.data.map(x=>`<tr data-id="${x.id}"><td>${esc(x.label)}</td><td>${esc(x.make_model)}</td><td><input class="od" type="number" value="${x.odometer==null?'':x.odometer}" style="width:90px"></td><td><input class="mp" type="number" step="0.1" value="${x.mpg==null?'':x.mpg}" style="width:70px"></td><td><input class="ac" type="checkbox"${x.active?' checked':''}></td><td><button>Save</button><span class="sub"></span></td></tr>`).join('')}</table>`;
 vh.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr'),sp=tr.querySelector('span'),n=e=>e.value===''?null:+e.value;
  const u=await sb.from('vehicles').update({odometer:n(tr.querySelector('.od')),mpg:n(tr.querySelector('.mp')),active:tr.querySelector('.ac').checked}).eq('id',tr.dataset.id).select('id');
  sp.textContent=u.error||!u.data.length?' Not saved':' Saved'});
}
load();
})();
</script></body></html>
