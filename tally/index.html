<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Dr. Pool Chemical Tally</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working page. Totals strip on top, tabbed tables below, a detail card opens above the tables when a number is clicked. */
:root{
  --bg:#f2f6f6; --surface:#ffffff; --ink:#13262b; --muted:#5d7176; --line:#d5e0e1; --tint:#e9f0f1;
  --accent:#0a6a86; --accent-ink:#ffffff; --acid:#a24a08; --acid-bg:#fbeedd;
  --good:#1f7a4d; --good-bg:#e0f2e8; --bad:#a3301f; --bad-bg:#f9e2de;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1b1f; --surface:#15272c; --ink:#e4eef0; --muted:#8ea5ab; --line:#27414a; --tint:#1b3138;
  --accent:#4cb8d6; --accent-ink:#06222b; --acid:#f0a35e; --acid-bg:#3a2a18;
  --good:#6fd3a0; --good-bg:#17382a; --bad:#f19a8c; --bad-bg:#3c1f1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1b1f; --surface:#15272c; --ink:#e4eef0; --muted:#8ea5ab; --line:#27414a; --tint:#1b3138;
  --accent:#4cb8d6; --accent-ink:#06222b; --acid:#f0a35e; --acid-bg:#3a2a18;
  --good:#6fd3a0; --good-bg:#17382a; --bad:#f19a8c; --bad-bg:#3c1f1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:20px 40px}
main{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);margin:6px 0 0}
header{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.stat .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .n{font-size:12px;color:var(--muted)}
.stat.acid .v{color:var(--acid)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{font:inherit;font-weight:500;border:1px solid transparent;background:none;color:var(--muted);padding:7px 14px;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
label.f{display:flex;align-items:center;gap:8px;color:var(--muted)}
select,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.panel{display:flex;flex-direction:column;gap:16px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
tr.grp td{background:var(--tint);font-weight:600;text-align:left}
td.m,.mono{font-family:var(--f-mono);font-size:13px}
td.acid{color:var(--acid);font-weight:500}
td small{display:block;color:var(--muted);font-size:11px}
td .oi{display:block}
.techin{width:130px;text-align:left}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.lnk{font:inherit;font-family:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-align:inherit}
td.acid .lnk{color:var(--acid)}
.lnk:hover{text-decoration-style:solid}
.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.panel h2{margin:20px 0 8px}
.dim td{color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.fig figcaption{font-weight:500;margin-bottom:4px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.chart .val,.chart .ref{fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .b{fill:var(--accent)}
.chart .hi .b{fill:var(--bad)}
.chart .lo .b{fill:var(--muted)}
.chart .hit{fill:transparent}
.chart .bar:hover .hit{fill:var(--tint)}
.chart .avgl{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.chart .lowl{stroke:var(--good);stroke-width:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:disabled{opacity:.45;cursor:default}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.heat td.c-hi{background:var(--bad-bg)}
.heat td.c-lo{background:var(--tint)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--muted)}

.settings{display:flex;flex-wrap:wrap;gap:12px 24px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.day{display:flex;flex-direction:column;gap:8px}
.detail{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dhead{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-start}
.dhead p{margin:2px 0 0;color:var(--muted)}
.hbtns{display:flex;flex-wrap:wrap;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line);filter:none}
.btn.primary:disabled:hover{border-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;resize:vertical;min-height:110px}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:6px;background:var(--tint)}
.drop.over{border-color:var(--accent)}
.drop textarea{border-color:transparent;background:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.bad-t{color:var(--bad)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs:empty{display:none}
.thumb{position:relative;width:84px;height:84px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--tint)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:99px;border:0;background:var(--ink);color:var(--surface);cursor:pointer;line-height:1;font-size:15px;padding:0}
.thumb .x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pv{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv:empty{display:none}
.routein{width:64px;text-align:right}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.alerts{display:flex;flex-direction:column;gap:10px}
.months{display:flex;flex-wrap:wrap;gap:8px}
.mtab{font:inherit;font-family:var(--f-display);font-weight:600;font-size:17px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.mtab small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.mtab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mtab[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}
.mtab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.bell{display:inline-flex;gap:6px;align-items:center}
.nlist{display:flex;flex-direction:column;gap:8px}
.nrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)}
.nrow>div{min-width:0}
.nrow small{display:block;color:var(--muted)}
.detail h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:6px 0 0}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.wk{display:inline-flex;gap:6px;align-items:baseline;margin-right:12px}
.stockbox{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.stockbox h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.stockbox p{margin:0}
.stockform{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.misslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.misslist li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.alert{border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.alert b{color:var(--bad)}
.alert p{margin:2px 0 0}
.alert label{font-weight:500}
.alert textarea{min-height:64px}
.ahead{display:flex;gap:12px;align-items:flex-start}
.ahead>div{min-width:0}
.athumb{width:64px;height:84px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:var(--surface);flex:none}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;text-align:center;padding:1px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill.neutral{background:var(--tint);color:var(--ink)}
.datein{width:140px}
.idin{width:110px}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.srch{position:relative;display:flex;align-items:center}
.srch input{width:210px;padding-right:26px}
.srch kbd{position:absolute;right:8px;font:11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;pointer-events:none}
.vsw{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.vsw button{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:7px 16px;cursor:pointer}
.vsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vsw button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.srow{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
.srow:hover{border-color:var(--accent)}
.srow .mono{font-weight:600}
.fig[data-ft]{cursor:zoom-in}
.fig[data-ft] figcaption::after{content:" \2922";color:var(--muted);font-size:13px}
.fig[data-ft]:hover,.fig[data-ft]:focus-visible{border-color:var(--accent);outline:none}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(5,15,20,.6);display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
.ovl .ovp{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(1200px,92vw);max-height:92vh;overflow:auto;padding:16px 20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.ovl .ovx{position:sticky;top:0;float:right;font:inherit;font-size:22px;line-height:1;width:36px;height:36px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ovl .ovx:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ovl .fig{border:0;padding:0;cursor:default}
.ovl .fig figcaption{font-size:20px;font-family:var(--f-display);font-weight:600;margin-bottom:8px}
.ovl .fig figcaption::after{content:none}
.ovl .chart text{font-size:11.5px}
@media (max-width:520px){h1{font-size:28px}.srch input{width:150px}.ovl{padding:2vh 2vw}.ovl .ovp{width:96vw;padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
var CATS=[
  {k:'chlorine',h:'Liquid chlorine',u:'gal'},
  {k:'tabs',h:'3" Xtreme tabs (50#)',u:'units'},
  {k:'bicarb',h:'Bicarb',u:'bags'},
  {k:'salt',h:'Salt',u:'bags'},
  {k:'acid',h:'Muriatic acid',u:'bottles'}
];
var TABS=[['route','By route'],['day','By day'],['prod','By product'],['acid','Muriatic acid'],['analytics','Analytics'],['inv','Invoices']];
var UMW={JUG:['jug','jugs'],GAL:['gal','gal'],PL:['unit','units'],PLT:['unit','units'],BAG:['bag','bags'],EA:['each','each'],DRM:['drum','drums'],CS:['box','boxes'],BTL:['bottle','bottles']};
var invoices=[],skipped=[],cfg={bottlePrice:4.36,perBox:4,techs:{},aliases:{}},tab='route',dateSel='all',loaded={inv:false},detail=null,vendSel='all';
function isPro(v){return !!v&&v.vendor==='Proline'}
var BR={techs:{},weeks:[],nos:null,cur:'',inflight:{},failed:{},q:Promise.resolve()};
function techLabel(r){return BR.techs[r]||cfg.techs[r]||''}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){n=Number(n||0);return (n<0?'−$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function dlabel(iso){if(iso==='2026-10-01')return 'Before app';var d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function rnum(r){var n=parseFloat(r);return isNaN(n)?1e9:n}

function bottlesOf(it){
  if(it.cat!=='acid')return 0;
  var um=String(it.um||'').toUpperCase(),q=Number(it.qty)||0;
  if(um==='BTL')return q;
  if(um==='CS')return q*cfg.perBox;
  return Math.round((Number(it.ext)||0)/cfg.bottlePrice);
}
function priceBottles(it){return Math.round((Number(it.ext)||0)/cfg.bottlePrice)}
/* Liquid chlorine is always counted in gallons. gpu = gallons per unit billed: 1 for gallon lines (SCP bulk, Proline 1 gallon bleach), 2.5 for a 2.5 gal jug sold by the jug. */
function gpuOf(it){var g=Number(it.gpu);if(g>0)return g;if(it.cat==='chlorine'&&/^(JUG|JG|EA)$/i.test(String(it.um||''))&&/2\.5\s*gal/i.test((it.desc||'')+' '+(it.label||'')))return 2.5;return 1}
function qOf(it){var q=Number(it.qty)||0;return it.cat==='chlorine'?q*gpuOf(it):q}
function boxText(b){
  var bx=Math.floor(b/cfg.perBox),r=b%cfg.perBox;
  if(!b)return '';
  if(bx&&!r)return bx+(bx===1?' box':' boxes');
  if(bx)return bx+(bx===1?' box':' boxes')+' + '+r;
  return 'loose';
}
function prodKey(it){return it.cat==='other'||!it.cat?'other:'+(it.group||it.label||it.desc):it.cat}
/* A product that is not a standing column moves out of "Other items" into its own column once 2 or more of it have been bought in total. */
var PROMOTE_AT=2;
function promoted(){
  var tot={},sample={};
  invoices.forEach(function(v){(v.items||[]).forEach(function(it){
    if(it.cat&&it.cat!=='other')return;
    var k=prodKey(it);tot[k]=(tot[k]||0)+(Number(it.qty)||0);if(!sample[k])sample[k]=it;
  })});
  return Object.keys(tot).filter(function(k){return tot[k]>=PROMOTE_AT}).map(function(k){
    return {k:k,h:k.slice(6),u:unitWord(sample[k],2)};
  }).sort(function(a,b){return a.h<b.h?-1:a.h>b.h?1:0});
}
function columns(){return CATS.concat(promoted())}
function prodName(k){
  if(k.indexOf('other:')===0)return k.slice(6);
  for(var i=0;i<CATS.length;i++)if(CATS[i].k===k)return CATS[i].h;
  return k;
}
function unitWord(it,q){
  var w=UMW[String(it.um||'').toUpperCase()];
  if(!w)return String(it.um||'').toLowerCase();
  return q===1?w[0]:w[1];
}
function qtyText(it){
  var q=Number(it.qty)||0;
  if(it.cat==='acid'){
    var b=bottlesOf(it);
    if(String(it.um).toUpperCase()==='CS')return num(q)+(q===1?' box':' boxes')+' = '+b+' bottles';
    return num(q)+(q===1?' bottle':' bottles');
  }

/* ---------- Analytics: the QUIMICOS sheet's columns R to AA, run for every chemical ---------- */
var DEF_STOPS={0:['GEFET',0],1:['MIKA',64],2:['LUIS PINASCO',81],3:['EVALDO',90],4:['RODRIGO',90],5:['CARLOS',82],6:['MIKE',79],7:['SAMUEL',85],8:['FABIO',90],9:['JEAN',64],10:['ADALBERTO',63],11:['MAICON',41],12:['ALDO',12]};
var NOCOMP={'0':1,'12':1}; /* Gefet and Aldo are shown but left out of the lowest and the average */
var AN=[
  {k:'chlorine',h:'Liquid chlorine',u:'gal'},
  {k:'tabs',h:'3" Xtreme tabs (50#)',u:'units'},
  {k:'acid',h:'Muriatic acid',u:'gal'},
  {k:'salt',h:'Salt',u:'bags'},
  {k:'bicarb',h:'Bicarb',u:'bags'},
  {k:'calcium',h:'Calcium',u:'bags'},
  {k:'stab',h:'Stabilizer',u:'drums'},
  {k:'nofumes',h:'No Fumes / sulfuric',u:'gal'},
  {k:'de',h:'DE / perlite',u:'bags'}
];
var GAL_PER_JUG=2.5,OUT=0.25;
var an={stops:{},wpm:4.3,bench:null,month:null,basis:'pe'},stopsRef=null,anChem='chlorine';
function anKey(it){
  var c=it.cat;
  if(c==='chlorine'||c==='tabs'||c==='salt'||c==='acid'||c==='bicarb')return c;
  var t=(it.group||'')+' '+(it.label||'')+' '+(it.desc||'')+' '+(it.sku||'');
  if(/calcium|cal[ -]?chlor|cal[ -]?hypo|hardness/i.test(t))return 'calcium';
  if(/stabil|granular 100|EZC-50-8100/i.test(t))return 'stab';
  if(/no fumes|sulfuric/i.test(t))return 'nofumes';
  if(/perlite|\bDE\b|filter media/i.test(t))return 'de';
  return null;
}
function brainStops(r){
  var mo=curView(),hit=null;
  BR.weeks.forEach(function(w){if(String(w.week).slice(0,7)===mo)hit=w});
  var x=hit&&hit.routes[r];return x&&x.stops>0?x.stops:null;
}
function stopsOf(r){var v=an.stops[r];if(v!==undefined&&v!==null&&v!=='')return Number(v)||0;var b=brainStops(r);if(b!==null)return b;return DEF_STOPS[r]?DEF_STOPS[r][1]:0}
function techName(r){return techLabel(r)||(DEF_STOPS[r]?DEF_STOPS[r][0]:'Route '+r)}
function anMonths(){return Array.from(new Set(invoices.map(function(v){return String(v.date||'').slice(0,7)}))).filter(Boolean).sort()}
function monthLabel(m){var d=new Date(m+'-15T12:00:00');return isNaN(d)?m:d.toLocaleDateString('en-US',{month:'long',year:'numeric'})}
function curMonth(){var ms=anMonths();return an.month&&ms.indexOf(an.month)>=0?an.month:ms[ms.length-1]}

function analyze(list,wpm,benchOverride,baseFn){
  var m={};
  Object.keys(DEF_STOPS).forEach(function(r){m[r]={route:r,q:{},c:{},W:0}});
  list.forEach(function(v){
    var r=String(v.route||'?'),a=m[r]||(m[r]={route:r,q:{},c:{},W:0});
    (v.items||[]).forEach(function(it){
      var ext=Number(it.ext)||0;a.W+=ext;
      var k=anKey(it);if(!k)return;
      var q=k==='acid'?bottlesOf(it):qOf(it);
      a.q[k]=(a.q[k]||0)+q;a.c[k]=(a.c[k]||0)+ext;
    });
  });
  var rows=Object.keys(m).map(function(r){return m[r]}).sort(function(a,b){return rnum(a.route)-rnum(b.route)});
  var A={rows:rows,wpm:wpm,tot:{q:{},c:{},W:0,S:0},comp:{q:{},c:{},W:0,S:0},chem:{}};
  rows.forEach(function(a){
    a.S=baseFn?baseFn(a.route):stopsOf(a.route);a.name=techName(a.route);
    a.comp=!NOCOMP[a.route]&&a.S>0&&a.W>0;
    [A.tot].concat(a.comp?[A.comp]:[]).forEach(function(t){
      t.W+=a.W;t.S+=a.S;
      AN.forEach(function(c){t.q[c.k]=(t.q[c.k]||0)+(a.q[c.k]||0);t.c[c.k]=(t.c[c.k]||0)+(a.c[c.k]||0)});
    });
  });
  /* columns W, Y, AA, X: cost, cost per quant, gap to the lowest, gap times quant */
  var low=null;
  rows.forEach(function(a){a.Y=a.S>0?a.W/a.S:null;if(a.comp&&(low===null||a.Y<low))low=a.Y});
  A.lowest=low;A.bench=benchOverride>0?benchOverride:low;
  A.avgY=A.comp.S?A.comp.W/A.comp.S:null;
  rows.forEach(function(a){
    a.AA=(a.Y!==null&&A.bench!==null&&a.W>0)?a.Y-A.bench:null;
    a.X=a.AA!==null?a.S*a.AA:null;
    a.dAvg=(a.Y!==null&&A.avgY!==null&&a.W>0)?a.Y-A.avgY:null;
    a.XAvg=a.dAvg!==null?a.S*a.dAvg:null;
  });
  /* the same columns for each chemical */
  AN.forEach(function(c){
    /* the average only counts the compared routes that bought this chemical */
    var s={k:c.k,low:null,lowCost:null,lowName:'',buyers:0},bq=0,bc=0,bS=0;
    rows.forEach(function(a){if(a.comp&&(a.q[c.k]||0)>0){bq+=a.q[c.k];bc+=a.c[c.k]||0;bS+=a.S;s.buyers++}});
    s.avgT=bS?bq/bS:0;
    s.avgV=s.avgT/wpm;
    s.avgCost=bS?bc/bS:0;
    rows.forEach(function(a){
      if(!a.comp)return;
      var q=a.q[c.k]||0;if(!q)return;
      var t=q/a.S;if(s.low===null||t<s.low){s.low=t;s.lowName=a.name}
      var cc=(a.c[c.k]||0)/a.S;if(s.lowCost===null||cc<s.lowCost)s.lowCost=cc;
    });
    A.chem[c.k]=s;
  });
  return A;
}
function cm(a,k,A){
  var q=a.q[k]||0,c=a.c[k]||0,s=A.chem[k],T=a.S?q/a.S:null;
  var r={q:q,c:c,T:T,V:T!==null?T/A.wpm:null,Y:a.S?c/a.S:null};
  r.pctTot=A.tot.q[k]?q/A.tot.q[k]:0;
  r.vsLow=(a.comp&&q&&s.low!==null)?T-s.low:null;
  r.vsAvg=(a.comp&&q&&s.avgT)?(T-s.avgT)/s.avgT:null;
  r.extra=(a.comp&&q&&r.Y!==null)?a.S*(r.Y-s.avgCost):null;
  r.flag=r.vsAvg===null?'':r.vsAvg>=OUT?'hi':(q&&r.vsAvg<=-OUT)?'lo':'';
  return r;
}

/* Horizontal bar chart: one bar per tech, a dashed line for the average and a solid one for the lowest. */
function hbar(o){
  var rows=o.rows;if(!rows.length)return '';
  var W=640,L=118,R=86,rh=26,top=34,H=top+rows.length*rh+8;
  var max=Math.max.apply(null,rows.map(function(r){return r.v}).concat([o.avg||0,o.low||0]))||1;
  function x(v){return L+(W-L-R)*Math.max(0,v)/max}
  var s='<figure class="fig" data-ft="'+esc(o.title)+'" tabindex="0" role="button" aria-label="Enlarge chart: '+esc(o.title)+'"><figcaption>'+esc(o.title)+'</figcaption><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.title)+'">';
  rows.forEach(function(r,i){
    var y=top+i*rh,w=Math.max(1,x(r.v)-L);
    s+='<g class="bar '+(r.flag||'')+'"><title>'+esc(r.tip)+'</title><rect class="hit" x="0" y="'+y+'" width="'+W+'" height="'+rh+'"></rect>'+
      '<text class="lab" x="'+(L-8)+'" y="'+(y+17)+'" text-anchor="end">'+esc(r.label)+'</text>'+
      '<rect class="b" x="'+L+'" y="'+(y+6)+'" width="'+w+'" height="'+(rh-12)+'" rx="3"></rect>'+
      '<text class="val" x="'+(L+w+6)+'" y="'+(y+17)+'">'+esc(o.fmt(r.v))+(r.flag==='hi'?' ▲':r.flag==='lo'?' ▼':'')+'</text></g>';

var schedules=[],PE_FROM='2026-11';
/* brain weeks (Sunday-dated in the brain, shown here by their Monday) win over manual uploads of the same week */
function allSched(){
  var out=BR.weeks.slice(),have={};
  BR.weeks.forEach(function(w){have[w.week]=1});
  schedules.forEach(function(s){if(!have[s.week])out.push(s)});
  return out;
}
function schedFor(mo){return allSched().filter(function(s){return String(s.week||'').slice(0,7)===mo}).sort(function(a,b){return a.week<b.week?-1:1})}
/* average a month's weekly schedules; pool equivalents = income / (total income / total pools) */
function peBase(mo){
  var ws=schedFor(mo),R={};
  ws.forEach(function(s){Object.keys(s.routes||{}).forEach(function(r){
    var x=s.routes[r],a=R[r]||(R[r]={route:r,name:x.name,pools:0,income:0});
    a.pools+=(Number(x.pools)||0)/ws.length;a.income+=(Number(x.income)||0)/ws.length;a.name=x.name||a.name;
  })});
  var tp=0,ti=0;Object.keys(R).forEach(function(r){tp+=R[r].pools;ti+=R[r].income});
  var avg=tp?ti/tp:0;
  Object.keys(R).forEach(function(r){R[r].pe=avg?R[r].income/avg:0});
  return {weeks:ws,routes:R,pools:tp,income:ti,avg:avg};
}

    a.rows.push({v:v,it:it});a.spend+=Number(it.ext)||0;a.routes[v.route]=1;a.inv[v.invoice]=1;
  })});
  var order=CATS.map(function(c){return c.k});

/* ---------- lines billed at 0: something ordered but not delivered ---------- */
var missDismissed={},missRef=null;
function zeroLines(d){
  return (d.items||[]).map(function(it,i){return {it:it,i:i}}).filter(function(x){
    var it=x.it,pr=Number(it.price)||0,q=Number(it.qty)||0,e=Number(it.ext)||0;
    if(/msds/i.test(it.desc||'')||String(it.sku||'').toUpperCase()==='CP')return false;
    return pr>0&&(q===0||e===0);
  });
}
function itemName(it){return it.cat==='acid'?'muriatic acid':String(it.label||it.desc||'').replace(/^(gal|gals|bag|bags|pail|pails|plt|box|boxes|each|unit|units)\s+/i,'')}
function itemText(it){return qtyText(it)+' '+itemName(it)}
function missKey(d,x){return d.invoice+'|'+(x.it.sku||x.it.desc||'')+'|'+x.i}
function sameItem(a,b){return (a.sku&&b.sku)?String(a.sku).toUpperCase()===String(b.sku).toUpperCase():(a.cat!=='other'?a.cat===b.cat:prodKey(a)===prodKey(b))}
function deliveredBy(d,it){
  var hit=null;
  invoices.forEach(function(v){
    if(hit||v.invoice===d.invoice)return;
    var sameOrder=d.order&&v.order&&v.order===d.order;
    if(!sameOrder)return;
    (v.items||[]).forEach(function(o){if(!hit&&sameItem(o,it)&&(Number(o.qty)||0)>0)hit=v});
  });
  return hit;
}
function missingList(){
  var out=[];

    var k=missKey(d,x),by=deliveredBy(d,x.it);

/* ---------- price-change notifications ---------- */
var alertAck={},alertShowAck=false,notifOpen=false;
var PRICE_MIN=0.02,PRICE_PCT=0.01,PRICE_WINDOW=8;
var PW={GAL:'gal',BAG:'bag',BTL:'bottle',CS:'case',EA:'each',DRM:'drum',PL:'pail',PLT:'pail',JUG:'jug'};
var XV={chlorine:'gal',acid:'bottle',salt:'bag',bicarb:'bag'};
function vendOf(v){return isPro(v)?'Proline':'SCP'}
function mmdd(iso){var m=/^\d{4}-(\d{2})-(\d{2})/.exec(iso||'');return m?m[1]+'/'+m[2]:String(iso||'')}
function unitPrice(it){var p=Number(it.price)||0,u=String(it.um||'').toUpperCase();if(it.cat==='chlorine')return p/gpuOf(it);if(it.cat==='acid')return u==='CS'?p/(cfg.perBox||4):p;return p}
function priceLines(){
  var rows=[];
  invoices.forEach(function(v){
    if(!v||v.source==='stock'||v.source==='sheet')return;
    (v.items||[]).forEach(function(it,i){
      var p=Number(it.price)||0;if(!(p>0))return;
      var vd=vendOf(v);
      rows.push({v:v,it:it,i:i,p:p,vendor:vd,k:vd+'|'+(it.sku||prodKey(it))+'|'+String(it.um||'').toUpperCase()});
    });
  });
  rows.sort(function(a,b){return a.v.date<b.v.date?-1:a.v.date>b.v.date?1:a.v.invoice<b.v.invoice?-1:a.v.invoice>b.v.invoice?1:a.i-b.i});
  return rows;
}
/* the typical price: the most common of the last few prices paid to that vendor for that product; a tie goes to the latest */
function typicalPrice(hist){
  var h=hist.slice(-PRICE_WINDOW),cnt={},best=null,bc=0;
  h.forEach(function(p){var k=p.toFixed(2);cnt[k]=(cnt[k]||0)+1});
  h.forEach(function(p){var k=p.toFixed(2);if(cnt[k]>=bc){bc=cnt[k];best=p}});
  return best;
}
function priceAlerts(){
  var hist={},out=[];
  priceLines().forEach(function(r){
    var h=hist[r.k]||(hist[r.k]=[]);
    if(h.length){
      var base=typicalPrice(h),d=Math.round((r.p-base)*100)/100;
      if(Math.abs(d)>=PRICE_MIN&&Math.abs(d)/base>=PRICE_PCT){
        out.push({id:(r.k+'|'+r.v.invoice+'|'+r.i).replace(/\./g,'_'),dir:d>0?'up':'down',name:prodName(prodKey(r.it)),from:base,to:r.p,unit:PW[String(r.it.um||'').toUpperCase()]||String(r.it.um||'').toLowerCase()||'unit',vendor:r.vendor,inv:r.v.invoice,route:r.v.route,date:r.v.date,cat:r.it.cat});
      }
    }
    h.push(r.p);
  });
  return out.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:a.inv<b.inv?1:a.inv>b.inv?-1:0});
}
function vendorGaps(){
  var latest={};
  priceLines().forEach(function(r){var c=r.it.cat;if(!XV[c])return;latest[c+'|'+r.vendor]={p:unitPrice(r.it)}});
  return Object.keys(XV).map(function(c){
    var s=latest[c+'|SCP'],p=latest[c+'|Proline'];if(!s||!p)return null;
    var gap=Math.round((p.p-s.p)*100)/100;
    return {cat:c,name:prodName(c),unit:XV[c],scp:s.p,pro:p.p,gap:gap,pct:s.p?gap/s.p:0};
  }).filter(Boolean);
}
function gapText(g){
  if(g.gap>0)return 'Proline is the more expensive one: '+money(g.pro)+' vs '+money(g.scp)+' per '+g.unit+' at SCP, '+money(g.gap)+' more ('+Math.round(g.pct*100)+'%)';
  if(g.gap<0)return 'Proline is cheaper here: '+money(g.pro)+' vs '+money(g.scp)+' per '+g.unit+' at SCP, '+money(-g.gap)+' less';
  return 'Same price at both vendors: '+money(g.scp)+' per '+g.unit;
}
function alertText(a){
  return '<b>'+esc(a.name)+' went '+a.dir+':</b> '+money(a.from)+' -&gt; '+money(a.to)+' per '+esc(a.unit)+', '+esc(a.vendor)+', invoice '+invLink(a.inv)+', route '+esc(a.route)+', '+esc(mmdd(a.date));
}
function renderAlerts(){
  var bell=document.getElementById('bellN');if(!bell)return;
  var al=priceAlerts(),gaps=vendorGaps(),gapBy={};
  gaps.forEach(function(g){gapBy[g.cat]=g});
  var open=al.filter(function(a){return !alertAck[a.id]}),done=al.filter(function(a){return alertAck[a.id]});
  bell.textContent=open.length;bell.hidden=!open.length;
  var bb=document.getElementById('bellBtn');
  bb.setAttribute('aria-expanded',notifOpen?'true':'false');
  bb.title=open.length?open.length+' new price change'+(open.length===1?'':'s'):'No new price changes';
  function row(a,isAck){
    var g=gapBy[a.cat];
    return '<div class="nrow"><div><span class="pill '+(a.dir==='up'?'bad':'neutral')+'">'+(a.dir==='up'?'Up':'Info, down')+'</span> '+alertText(a)+(g?'<small>'+esc(gapText(g))+'</small>':'')+'</div>'+
      '<button class="btn" type="button" data-'+(isAck?'unack':'ack')+'="'+esc(a.id)+'">'+(isAck?'Undo':'Acknowledge')+'</button></div>';
  }
  /* banner: the newest unacknowledged increases */
  var ban=document.getElementById('priceBanner'),ups=open.filter(function(a){return a.dir==='up'}).slice(0,3);
  if(!ups.length||notifOpen){ban.innerHTML='';ban.hidden=true}
  else{
    ban.hidden=false;
    ban.innerHTML=ups.map(function(a){return '<div class="alert"><div>'+alertText(a)+'</div><div class="row"><button class="btn" type="button" data-ack="'+esc(a.id)+'">Acknowledge</button><button class="btn" type="button" data-bell="1">All price alerts ('+open.length+')</button></div></div>'}).join('');
  }
  var el=document.getElementById('notif');
  if(!notifOpen){el.innerHTML='';el.hidden=true;return}
  el.hidden=false;
  var h='<div class="dhead"><div><h2>Price alerts</h2><p>Each invoice line is compared with the typical price paid to the same vendor for the same product (the most common of the last '+PRICE_WINDOW+'). Increases are flagged; decreases are for information. '+al.length+' found across '+invoices.length+' invoices, newest first.</p></div><div class="hbtns">'+(open.length?'<button class="btn primary" type="button" data-ackall="1">Acknowledge all ('+open.length+')</button>':'')+'<button class="btn" type="button" data-bell="1">Close</button></div></div>';
  h+='<h3>New ('+open.length+')</h3>'+(open.length?'<div class="nlist">'+open.slice(0,100).map(function(a){return row(a,false)}).join('')+'</div>'+(open.length>100?'<div class="note">Showing the newest 100.</div>':''):'<div class="empty">No new price changes.</div>');
  h+='<h3>Vendor price gap</h3>'+(gaps.length?'<div class="nlist">'+gaps.map(function(g){return '<div class="nrow"><div><b>'+esc(g.name)+'</b> <small>'+esc(gapText(g))+' (latest price from each vendor)</small></div></div>'}).join('')+'</div>':'<div class="empty">No product has been bought from both vendors yet.</div>');
  h+='<div><button class="linkbtn" type="button" data-ackshow="1">'+(alertShowAck?'Hide':'Show')+' acknowledged ('+done.length+')</button></div>';
  if(alertShowAck&&done.length)h+='<div class="nlist">'+done.slice(0,100).map(function(a){return row(a,true)}).join('')+'</div>';
  el.innerHTML=h;
}
var remoteAck={},localAck={};
try{localAck=JSON.parse(localStorage.getItem('tally-ack')||'{}')||{}}catch(x){localAck={}}
function mergeAck(){var m={};Object.keys(remoteAck).forEach(function(k){m[k]=1});Object.keys(localAck).forEach(function(k){if(localAck[k])m[k]=1;else delete m[k]});alertAck=m}
function saveAck(){mergeAck();try{localStorage.setItem('tally-ack',JSON.stringify(localAck))}catch(x){}renderAlerts()}
function setAck(id,on){localAck[id]=on?1:0;saveAck()}
document.addEventListener('click',function(e){
  var t=e.target;if(!t||!t.closest)return;
  if(t.closest('#bellBtn')||t.closest('[data-bell]')){notifOpen=!notifOpen;renderAlerts();return}
  var a=t.closest('[data-ack]');if(a){setAck(a.getAttribute('data-ack'),true);return}
  var u=t.closest('[data-unack]');if(u){setAck(u.getAttribute('data-unack'),false);return}
  if(t.closest('[data-ackall]')){priceAlerts().forEach(function(x){localAck[x.id]=1});saveAck();return}
  if(t.closest('[data-ackshow]')){alertShowAck=!alertShowAck;renderAlerts()}
});


/* ---------- data from Supabase (read-only, Office staff only) ---------- */
var sb=DrPool.sb,BR={techs:{},weeks:[]};
function techLabel(r){return BR.techs[r]||cfg.techs[r]||''}
function rowToInv(r){
  var its=(r.supplier_invoice_lines||[]).slice().sort(function(a,b){return (a.line_no||0)-(b.line_no||0)}).map(function(l){
    var o={cat:l.category||'other',desc:l.description||'',ext:Number(l.ext)||0,label:l.label||l.description||'',price:Number(l.price)||0,qty:Number(l.qty)||0,sku:l.sku||'',um:l.um||''};
    if(l.product_group)o.group=l.product_group;
    if(l.gpu!=null&&Number(l.gpu)>0)o.gpu=Number(l.gpu);
    return o;
  });
  var v={date:String(r.invoice_date||'').slice(0,10),invoice:r.invoice_no,order:r.order_no||'',route:r.route_no==null?'?':String(r.route_no),total:Number(r.total)||0,items:its};
  if(r.supplier==='Proline')v.vendor='Proline';
  if(r.source==='sheet'||r.source==='stock')v.source=r.source;
  if(r.note)v.note=r.note;
  if(r.po_text)v.po=r.po_text;
  return v;
}
async function loadAll(){
  var inv=[],from=0,step=500;
  for(;;){
    var q=await sb.from('supplier_invoices').select('supplier,invoice_no,order_no,invoice_date,route_no,total,source,note,po_text,supplier_invoice_lines(line_no,sku,description,um,qty,price,ext,category,label,product_group,gpu)').order('invoice_date',{ascending:false}).order('invoice_no').range(from,from+step-1);
    if(q.error)throw q.error;
    inv=inv.concat(q.data||[]);if(!q.data||q.data.length<step)break;from+=step;
  }
  invoices=inv.map(rowToInv);loaded.inv=true;
  var t=await sb.from('technicians').select('route_no,name,active');
  if(!t.error)(t.data||[]).forEach(function(x){if(x.active&&(x.route_no!=null||x.name==='Geffet'))BR.techs[String(x.route_no==null?0:x.route_no)]=x.name});
  var st=await sb.from('tally_settings').select('key,value');
  if(!st.error)(st.data||[]).forEach(function(x){
    if(x.key==='config'&&x.value){var d=x.value;cfg={bottlePrice:Number(d.bottlePrice)>0?Number(d.bottlePrice):4.36,perBox:Number(d.perBox)>0?Number(d.perBox):4,techs:d.techs||{},aliases:d.aliases||{}}}
    if(x.key==='alerts'&&x.value){remoteAck=x.value.ack||{}}
  });
  mergeAck();
  var w=await sb.from('v_route_summary').select('week_of,route_no,tech_name,stops,pools,income');
  if(!w.error){
    var m={};(w.data||[]).forEach(function(x){
      var k=String(x.week_of).slice(0,10),wk=m[k]||(m[k]={week:addDaysISO(k,1),brainWeek:k,src:'brain',routes:{}});
      wk.routes[String(x.route_no)]={name:x.tech_name,pools:Number(x.pools)||0,income:Number(x.income)||0,stops:Number(x.stops)||0};
    });
    BR.weeks=Object.keys(m).sort().map(function(k){return m[k]});
  }
}
function addDaysISO(iso,n){var d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
/* ---------- invoice search ---------- */
function srchRows(q){
  var toks=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length)return [];
  return invoices.filter(function(v){
    var hay=[v.invoice,v.order,v.route,'route '+v.route,techLabel(v.route),(v.route==='0'?'geffet jeff':''),v.note,isPro(v)?'proline':(isStock(v)?'stock':'scp'),v.date].join(' ').toLowerCase();
    return toks.every(function(t){return hay.indexOf(t)>=0});
  }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
}
function drawSearch(){
  var el=document.getElementById('srchRes'),q=document.getElementById('srchIn').value.trim();
  if(!q){el.hidden=true;el.innerHTML='';return}
  var r=srchRows(q),h='<div class="dhead"><div><h2>Search</h2><p>'+r.length+' match'+(r.length===1?'':'es')+' for &ldquo;'+esc(q)+'&rdquo; in all months, SCP and Proline'+(r.length>40?' (showing the newest 40)':'')+'</p></div><button class="btn" type="button" data-sr="close">Close</button></div>';
  if(!r.length)h+='<div class="empty">No invoice matches &ldquo;'+esc(q)+'&rdquo;. Try part of the invoice number, a route number or a tech name.</div>';
  else h+='<div class="misslist">'+r.slice(0,40).map(function(v){
    return '<button type="button" class="srow" data-sr="'+esc(v.invoice)+'"><span class="mono">'+(isStock(v)?'From stock':esc(v.invoice))+'</span>'+(isPro(v)?'<span class="pill neutral">Proline</span>':'<span class="pill neutral">SCP</span>')+'<span>'+esc(dlabel(v.date))+' '+esc(String(v.date||'').slice(0,4))+'</span><span>Route '+esc(v.route)+techOf(v.route)+'</span><span class="mono">'+(isStock(v)?'':money(v.total))+'</span></button>';
  }).join('')+'</div>';
  el.innerHTML=h;el.hidden=false;
}
function openFound(id){
  var v=invoices.filter(function(x){return x.invoice===id})[0];if(!v)return;
  monthSel=String(v.date||'').slice(0,7);dateSel='all';vendSel='all';if(tab==='analytics')tab=lastTab||'route';
  detail={kind:'inv',id:id};
  document.getElementById('srchIn').value='';drawSearch();
  render();renderDetail(true);
}
document.getElementById('srchIn').addEventListener('input',drawSearch);
document.getElementById('srchIn').addEventListener('keydown',function(e){
  if(e.key==='Escape'){this.value='';drawSearch();this.blur()}
  if(e.key==='Enter'){var f=document.querySelector('#srchRes [data-sr]:not([data-sr="close"])');if(f){e.preventDefault();openFound(f.getAttribute('data-sr'))}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    var t=e.target,tn=t&&t.tagName;if(tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'||(t&&t.isContentEditable))return;
    e.preventDefault();var i=document.getElementById('srchIn');i.focus();i.select();
  }
});
document.addEventListener('click',function(e){
  var s=e.target.closest('[data-sr]');
  if(s){var k=s.getAttribute('data-sr');if(k==='close'){document.getElementById('srchIn').value='';drawSearch()}else openFound(k);return}
  var vb=e.target.closest('[data-view]');
  if(vb){tab=vb.getAttribute('data-view')==='analytics'?'analytics':(lastTab||'route');detail=null;render()}
});

/* ---------- enlarge a chart ---------- */
var ovl=null,ovFrom=null,ovTitle='';
function closeOv(){
  if(!ovl)return;
  var o=ovl,t=ovTitle;ovl=null;
  document.removeEventListener('keydown',ovKey,true);
  o.remove();document.body.style.overflow='';
  var back=ovFrom&&document.body.contains(ovFrom)?ovFrom:Array.prototype.filter.call(document.querySelectorAll('.fig[data-ft]'),function(x){return x.getAttribute('data-ft')===t})[0];
  if(back)try{back.focus()}catch(x){}
}
function ovKey(e){
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeOv();return}
  if(e.key==='Tab'&&ovl){var f=ovl.querySelectorAll('button');if(f.length){e.preventDefault();f[0].focus()}}
}
function openOv(card){
  if(ovl)return;
  var rect=card.getBoundingClientRect();ovFrom=card;ovTitle=card.getAttribute('data-ft')||'';
  var o=document.createElement('div');o.className='ovl';
  var clone=card.cloneNode(true);clone.removeAttribute('tabindex');clone.removeAttribute('role');clone.removeAttribute('aria-label');clone.removeAttribute('data-ft');
  o.innerHTML='<div class="ovp" role="dialog" aria-modal="true" aria-label="'+esc(ovTitle)+'"><button type="button" class="ovx" aria-label="Close chart">&times;</button></div>';
  var p=o.firstChild;p.appendChild(clone);
  o.addEventListener('click',function(e){if(e.target===o||e.target.closest('.ovx'))closeOv()});
  document.body.appendChild(o);document.body.style.overflow='hidden';ovl=o;
  document.addEventListener('keydown',ovKey,true);
  p.querySelector('.ovx').focus();
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce&&p.animate){
    var r2=p.getBoundingClientRect(),dx=rect.left+rect.width/2-(r2.left+r2.width/2),dy=rect.top+rect.height/2-(r2.top+r2.height/2),sx=rect.width/r2.width,sy=rect.height/r2.height;
    p.animate([{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',opacity:.4},{transform:'none',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});
    o.animate([{opacity:0},{opacity:1}],{duration:200});
  }
}
document.addEventListener('click',function(e){
  var c=e.target.closest('.fig[data-ft]');if(c&&!c.closest('.ovl'))openOv(c);
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('fig')&&e.target.hasAttribute('data-ft')){e.preventDefault();openOv(e.target)}
});

render();
(async function(){
  var me=await DrPool.requireLogin({office:true});
  if(!me)return;
  DrPool.topBar('tally');
  try{await loadAll()}catch(e){
    document.getElementById('panel').innerHTML='<div class="alert"><div><b>The tally could not be loaded</b><p>'+esc((e&&e.message)||'Check your connection and reload. If this keeps happening, ask Daniel.')+'</p></div></div>';
    return;
  }
  render();
})();
})();
</script>
